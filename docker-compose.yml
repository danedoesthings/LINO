version: '3.8'

services:
  api:
    build: ./deobf-api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    restart: unless-stopped

  bot:
    build: ./deobf-bot
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - API_URL=http://api:5000
    depends_on:
      - api
    restart: unless-stopped
